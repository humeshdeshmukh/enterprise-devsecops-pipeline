# SonarQube Project Configuration
sonar.projectKey=enterprise-devsecops-pipeline
sonar.projectName=Enterprise DevSecOps CI/CD Pipeline
sonar.projectVersion=1.0.0

# Path to the source directories
sonar.sources=app
# Path to the test directories
sonar.tests=app/tests

# Language specific options
sonar.language=py
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# File exclusions
sonar.exclusions=app/tests/**, **/venv/**, **/.pytest_cache/**, **/htmlcov/**
sonar.test.inclusions=app/tests/**/test_*.py

# Encoding of the source files
sonar.sourceEncoding=UTF-8
