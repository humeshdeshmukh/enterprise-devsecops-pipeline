apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "product-catalog.fullname" . }}-config
  labels:
    {{- include "product-catalog.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.config.port | quote }}
  ENV: {{ .Values.config.env | quote }}
